[project]
name = "gitgit3d"
version = "0.1.0"
description = "Engine image-to-3D + auto-rig + animasi dasar, self-hosted (CPU)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy<2.3",
  "omegaconf>=2.3",
  "einops>=0.7",
  "transformers>=4.40,<5",
  "huggingface-hub>=0.23",
  "trimesh>=4.4",
  "PyMCubes>=0.1.6",
  "fast-simplification>=0.1.7",
  "xatlas>=0.0.9",
  "rembg[cpu]>=2.0.57",
  "onnxruntime>=1.18",
  "Pillow>=10",
  "scipy>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
